server {
    # nginx-unprivileged corre sin root: no puede abrir puertos < 1024.
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de nginx en headers ni páginas de error.
    server_tokens off;

    # Servir las versiones .gz precomprimidas en el build si existen…
    gzip_static on;
    # …y comprimir en vivo lo que no esté precomprimido.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json
                    application/xml image/svg+xml font/woff2;

    # Endpoint liviano para el HEALTHCHECK (no sirve el index completo).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Astro genera carpetas con index.html (build.format: 'directory').
    # Probamos ruta directa, carpeta y variante .html antes del 404.
    location / {
        try_files $uri $uri/ $uri/index.html $uri.html =404;

        # Cabeceras de seguridad (aplican a las respuestas HTML).
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Assets con hash en el nombre → cache inmutable de 1 año.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Resto de estáticos → cache media.
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    error_page 404 /404.html;
}
